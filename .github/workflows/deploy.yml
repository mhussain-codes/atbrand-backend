name: Build and Auto-Deploy to Hostinger

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build Production Frontend
        run: |
          node apps/web/generate-sitemap.js
          cd apps/web
          npx vite build --outDir dist
          node scripts/generate-route-html.js

      - name: Deploy to 'deploy' Branch for Hostinger Git
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./apps/web/dist
          commit_message: "Auto-build and deploy to Hostinger [skip ci]"
