<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101827" />
  <title>AT BRAND | Store Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#f4f6fa; color:#172033; }
    button,input,select,textarea { font:inherit; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .nav-item { transition:all .16s ease; }
    .nav-item.active { background:#24344d; color:#fff; box-shadow:inset 3px 0 #77a9ff; }
    .nav-item:not(.active):hover { background:#1b273a; color:#fff; }
    .card { background:#fff; border:1px solid #e8ebf1; border-radius:16px; box-shadow:0 2px 8px #15213a08; }
    .field { width:100%; border:1px solid #dce1ea; border-radius:10px; background:#fff; padding:10px 12px; outline:none; }
    .field:focus { border-color:#5288ee; box-shadow:0 0 0 3px #5288ee20; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:10px 14px; font-weight:650; transition:.15s; }
    .btn-primary { color:#fff; background:#2764d8; } .btn-primary:hover { background:#1f54bb; }
    .btn-light { color:#27344a; background:#f1f4f8; } .btn-light:hover { background:#e7ebf2; }
    .btn-danger { color:#a12d37; background:#fff0f0; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    th { padding:12px 14px; color:#718096; background:#f8f9fb; text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    td { padding:13px 14px; border-top:1px solid #edf0f4; font-size:13px; }
    .badge { display:inline-flex; align-items:center; border-radius:99px; padding:4px 9px; font-size:11px; font-weight:700; text-transform:capitalize; }
    .toast { animation:fadein .2s ease-out; } @keyframes fadein { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:none } }
    @media(max-width:760px) { #sidebar { position:fixed; z-index:30; inset:0 auto 0 0; width:260px; transform:translateX(-100%); transition:transform .2s; } #sidebar.open { transform:translateX(0); } #scrim.show { display:block; } main { padding:18px!important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" class="fixed right-4 top-4 z-[100] grid gap-2"></div>
  <script>
    /*
      AT BRAND Store Console frontend.
      Configure the public Supabase project settings and your deployed API URL below.
      Never put a Supabase service-role key or database password in this file.
      This UI expects the API contract listed in the companion handoff/README.
    */
    window.ATBRAND_CONFIG = window.ATBRAND_CONFIG || {
      API_BASE_URL: "https://YOUR-VERCEL-DEPLOYMENT.vercel.app",
      SUPABASE_URL: "https://mgolzolmhfqsjziuuauq.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_rtLskjbjkcVlAhERU8q7Kw_EfyTNA4R"
    };
    (() => {
      const config = window.ATBRAND_CONFIG;
      const sbReady = !!(window.supabase && config.SUPABASE_URL.startsWith("https://") && !config.SUPABASE_URL.includes("YOUR-") && config.SUPABASE_ANON_KEY && !config.SUPABASE_ANON_KEY.includes("YOUR_"));
      const supabase = sbReady ? window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }) : null;
      const state = { session:null, user:null, page:"overview", busy:false, sidebar:false, products:[], orders:[], expenses:[], report:null, cart:[], search:"", dateFrom:"", dateTo:"", orderStatus:"all" };
      const app = document.getElementById("app");
      const money = n => n==null ? "—" : new Intl.NumberFormat("en-PK", { style:"currency", currency:"PKR", maximumFractionDigits:0 }).format(Number(n||0));
      const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const dateFmt = value => value ? new Date(value).toLocaleString("en-PK", { dateStyle:"medium", timeStyle:"short" }) : "—";
      const initials = value => String(value||"A").split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
      const statusStyle = status => ({ delivered:"bg-emerald-50 text-emerald-700", paid:"bg-emerald-50 text-emerald-700", dispatched:"bg-blue-50 text-blue-700", pending:"bg-amber-50 text-amber-700", cancelled:"bg-rose-50 text-rose-700", refunded:"bg-violet-50 text-violet-700", failed:"bg-rose-50 text-rose-700" }[String(status||"").toLowerCase()] || "bg-slate-100 text-slate-600");
      function toast(message, type="success") { const el=document.createElement("div"); el.className=`toast rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-lg ${type==="error"?"bg-rose-700":"bg-slate-900"}`; el.textContent=message; document.getElementById("toast-root").appendChild(el); setTimeout(()=>el.remove(),4000); }
      function configProblem() { return !config.API_BASE_URL || config.API_BASE_URL.includes("YOUR-") || !sbReady; }
      async function api(path, options={}) {
        if (!state.session?.access_token) throw new Error("Your session expired. Please sign in again.");
        const base=config.API_BASE_URL.replace(/\/$/,"");
        const headers={ "Authorization":`Bearer ${state.session.access_token}`, "Accept":"application/json", ...(options.body instanceof FormData ? {} : {"Content-Type":"application/json"}), ...(options.headers||{}) };
        const response=await fetch(`${base}${path}`, { ...options, headers, credentials:"omit" });
        let payload={}; try { payload=await response.json(); } catch {}
        if (!response.ok) throw new Error(payload.message || payload.error || `Request failed (${response.status})`);
        return payload;
      }
      async function loadPageData(page=state.page) {
        state.busy=true; render();
        try {
          if (page==="overview" || page==="reports") {
            const qs=new URLSearchParams(); if(state.dateFrom)qs.set("from",state.dateFrom); if(state.dateTo)qs.set("to",state.dateTo);
            const result=await api(`/api/v1/admin/reports/summary${qs.size?`?${qs}`:""}`); state.report=result.data||result;
            const recent=await api("/api/v1/admin/orders?limit=6&sort=created_at.desc"); state.orders=recent.data||recent.orders||[];
          } else if(page==="orders") {
            const qs=new URLSearchParams({limit:"50",sort:"created_at.desc"}); if(state.orderStatus!=="all")qs.set("status",state.orderStatus); if(state.search)qs.set("search",state.search);
            const result=await api(`/api/v1/admin/orders?${qs}`); state.orders=result.data||result.orders||[];
          } else if(page==="products" || page==="pos") {
            const qs=new URLSearchParams({limit:"100",sort:"created_at.desc"}); if(state.search)qs.set("search",state.search);
            const result=await api(`/api/v1/admin/products?${qs}`); state.products=result.data||result.products||[];
          } else if(page==="expenses") {
            const qs=new URLSearchParams({limit:"50",sort:"expense_date.desc"}); if(state.dateFrom)qs.set("from",state.dateFrom); if(state.dateTo)qs.set("to",state.dateTo);
            const result=await api(`/api/v1/admin/expenses?${qs}`); state.expenses=result.data||result.expenses||[];
          }
        } catch(error) { toast(error.message,"error"); }
        finally { state.busy=false; render(); }
      }
      function emptyState(title, detail) { return `<div class="py-14 text-center"><div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-2xl bg-slate-100 text-xl">⌕</div><p class="font-bold text-slate-700">${esc(title)}</p><p class="mt-1 text-sm text-slate-500">${esc(detail)}</p></div>`; }
      function loginView() {
        app.innerHTML=`<div class="grid min-h-screen lg:grid-cols-[1.1fr_.9fr]"><div class="hidden flex-col justify-between bg-[#101827] p-12 text-white lg:flex"><div class="text-2xl font-black tracking-tight">AT<span class="text-blue-400">.</span> BRAND</div><div><div class="mb-4 inline-flex rounded-full border border-white/10 px-3 py-1 text-xs text-blue-200">STORE OPERATIONS</div><h1 class="max-w-xl text-5xl font-black leading-tight">Your store, in control.</h1><p class="mt-5 max-w-lg text-slate-300">Manage orders, inventory, in-store sales and business performance from one secure workspace.</p></div><p class="text-xs text-slate-500">Private admin workspace · PKR</p></div><div class="flex items-center justify-center p-6"><form id="login-form" class="w-full max-w-md"><div class="mb-10 lg:hidden text-xl font-black">AT<span class="text-blue-600">.</span> BRAND</div><p class="text-sm font-bold uppercase tracking-widest text-blue-600">Welcome back</p><h2 class="mt-2 text-3xl font-black text-slate-900">Sign in to your store</h2><p class="mt-2 text-sm text-slate-500">Use your authorized admin account.</p>${configProblem()?`<div class="mt-6 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900"><b>Setup required</b><br>HTML ke start mein <code>ATBRAND_CONFIG</code> ko apne public Supabase URL/anon key aur deployed API URL se configure karein. Service-role key yahan kabhi na daalein.</div>`:""}<label class="mt-7 block text-sm font-semibold">Email address<input class="field mt-2" type="email" name="email" autocomplete="username" required placeholder="you@yourstore.com"></label><label class="mt-4 block text-sm font-semibold">Password<input class="field mt-2" type="password" name="password" autocomplete="current-password" required placeholder="Your password"></label><button class="btn btn-primary mt-6 w-full" type="submit">Sign in securely</button><p id="login-error" class="mt-4 text-sm text-rose-700"></p><p class="mt-8 text-xs leading-relaxed text-slate-400">Access is verified by Supabase Auth and your server API. Dashboard data stays unavailable until the backend is configured.</p></form></div></div>`;
        document.getElementById("login-form").addEventListener("submit", async e=>{ e.preventDefault(); const form=e.currentTarget; const button=form.querySelector("button"); button.disabled=true; button.textContent="Signing in…"; try { if(!supabase)throw new Error("Supabase public configuration is missing."); const {data,error}=await supabase.auth.signInWithPassword({email:form.email.value.trim(),password:form.password.value}); if(error)throw error; state.session=data.session; state.user=data.user; await loadPageData("overview"); } catch(err) { document.getElementById("login-error").textContent=err.message; button.disabled=false; button.textContent="Sign in securely"; } });
      }
      const nav=[ ["overview","▦","Overview"],["orders","▤","Orders"],["products","▣","Products & stock"],["pos","▣","Shop POS"],["expenses","↗","Expenses"],["reports","▥","Reports"] ];
      function shell(content) {
        const userLabel=state.user?.email||"Store user";
        app.innerHTML=`<div id="scrim" class="fixed inset-0 z-20 hidden bg-slate-950/40" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('show')"></div><div class="flex min-h-screen"><aside id="sidebar" class="flex w-[250px] shrink-0 flex-col bg-[#101827] text-white"><div class="flex h-[76px] items-center gap-3 border-b border-white/10 px-6"><div class="grid h-9 w-9 place-items-center rounded-xl bg-blue-600 font-black">AT</div><div><div class="font-black tracking-wide">AT BRAND</div><div class="text-[10px] font-semibold tracking-[.18em] text-slate-400">STORE CONSOLE</div></div></div><div class="px-4 pt-6 text-[10px] font-bold uppercase tracking-[.18em] text-slate-500">Workspace</div><nav class="mt-2 flex-1 space-y-1 px-3">${nav.map(([id,icon,label])=>`<button data-page="${id}" class="nav-item ${state.page===id?"active":""} flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold text-slate-300"><span class="grid h-6 w-6 place-items-center text-lg">${icon}</span>${label}</button>`).join("")}</nav><div class="border-t border-white/10 p-4"><div class="flex items-center gap-3"><div class="grid h-9 w-9 place-items-center rounded-full bg-slate-700 text-xs font-bold">${esc(initials(userLabel))}</div><div class="min-w-0 flex-1"><div class="truncate text-xs font-bold">${esc(userLabel)}</div><div id="role-label" class="text-[10px] capitalize text-slate-400">Authorized account</div></div><button id="logout" title="Sign out" class="rounded-lg p-2 text-slate-400 hover:bg-white/10 hover:text-white">↪</button></div></div></aside><section class="min-w-0 flex-1"><header class="sticky top-0 z-10 flex h-[76px] items-center justify-between border-b border-slate-200 bg-white/95 px-5 backdrop-blur md:px-8"><div class="flex items-center gap-3"><button id="mobile-menu" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 md:hidden">☰</button><div><div class="text-xs font-semibold text-slate-400">AT BRAND / ${esc(state.page.replace("-"," "))}</div><h1 class="text-lg font-black capitalize text-slate-900">${esc(nav.find(x=>x[0]===state.page)?.[2]||state.page)}</h1></div></div><div class="flex items-center gap-2"><span class="hidden rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-700 sm:inline-flex">● Secure session</span><button id="refresh" class="btn btn-light text-sm">↻ <span class="hidden sm:inline">Refresh</span></button></div></header><main class="mx-auto max-w-[1500px] p-5 md:p-8">${content}</main><footer class="px-8 pb-6 text-center text-[11px] text-slate-400">AT BRAND Store Console · PKR · Secure server-side operations</footer></section></div>`;
        app.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
        document.getElementById("refresh").onclick=()=>loadPageData(); document.getElementById("logout").onclick=logout;
        document.getElementById("mobile-menu").onclick=()=>{document.getElementById("sidebar").classList.toggle("open");document.getElementById("scrim").classList.toggle("show")};
      }
      function metric(label,value,detail,icon,tone="blue") { const colors={blue:"bg-blue-50 text-blue-600",green:"bg-emerald-50 text-emerald-600",amber:"bg-amber-50 text-amber-600",violet:"bg-violet-50 text-violet-600"}; return `<article class="card p-5"><div class="flex items-start justify-between"><div class="text-sm font-semibold text-slate-500">${esc(label)}</div><div class="grid h-10 w-10 place-items-center rounded-xl ${colors[tone]}">${icon}</div></div><div class="mt-4 text-2xl font-black text-slate-900">${esc(value)}</div><div class="mt-1 text-xs text-slate-400">${esc(detail||"")}</div></article>`; }
      function overviewView() {
        const r=state.report||{}; const k=r.metrics||r;
        return `<div class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-2xl font-black">Good ${new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening"}, ${esc((state.user?.email||"there").split("@")[0])}.</h2><p class="mt-1 text-sm text-slate-500">Here’s what’s happening with your store.</p></div><span class="text-sm text-slate-500">${new Date().toLocaleDateString("en-PK",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</span></div><div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${metric("Collected payments",money(k.collected_payments),"Recorded successful payments","₨","green")}${metric("Orders",k.orders_count??0,"Within selected report period","▤","blue")}${metric("Gross profit",money(k.gross_profit),"Based on recorded item costs","↗","violet")}${metric("Low stock items",k.low_stock_count??0,"Products at or below threshold","!","amber")}</div><div class="mt-6 grid gap-5 xl:grid-cols-[1.5fr_1fr]"><section class="card"><div class="flex items-center justify-between border-b border-slate-100 p-5"><div><h3 class="font-black">Recent orders</h3><p class="mt-1 text-xs text-slate-400">Latest store activity</p></div><button class="text-sm font-bold text-blue-600" data-page="orders">View all →</button></div>${recentOrdersTable(state.orders.slice(0,6))}</section><div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-1"><section class="card p-5"><h3 class="font-black">Business snapshot</h3><div class="mt-4 space-y-4">${snapshotRow("POS sales",money(k.pos_sales))}${snapshotRow("Online sales",money(k.online_sales))}${snapshotRow("Expenses",money(k.expenses))}${snapshotRow("Net profit",money(k.net_profit))}</div></section><section class="rounded-2xl bg-blue-600 p-5 text-white"><div class="text-sm font-bold text-blue-100">Inventory tip</div><p class="mt-2 text-lg font-black">Keep stock in sync</p><p class="mt-1 text-sm leading-relaxed text-blue-100">Online orders and shop sales should update the same inventory through the API.</p><button class="mt-4 rounded-lg bg-white/15 px-3 py-2 text-sm font-bold hover:bg-white/20" data-page="products">Review inventory →</button></section></div></div>${state.busy?loadingLine():""}`;
      }
      function snapshotRow(label,value){return `<div class="flex items-center justify-between border-b border-slate-100 pb-3 last:border-0 last:pb-0"><span class="text-sm text-slate-500">${esc(label)}</span><b class="text-sm">${esc(value)}</b></div>`}
      function loadingLine(){return `<div class="my-6 flex items-center gap-3 text-sm font-semibold text-slate-500"><span class="h-2 w-2 animate-ping rounded-full bg-blue-600"></span>Loading latest data…</div>`}
      function recentOrdersTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows.map(o=>`<tr><td class="font-bold">#${esc(String(o.order_number||o.id||"").slice(-8))}</td><td>${esc(o.customer_name||o.customer?.name||"Walk-in")}</td><td>${esc(dateFmt(o.created_at))}</td><td class="font-bold">${esc(money(o.total_amount))}</td><td><span class="badge ${statusStyle(o.status)}">${esc(o.status)}</span></td></tr>`).join("")}</tbody></table></div>`:emptyState("No orders yet","New online orders will appear here.")}
      function ordersView(){return `<div class="mb-5 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-xl font-black">Order management</h2><p class="mt-1 text-sm text-slate-500">Track fulfilment and payment as separate statuses.</p></div><div class="flex gap-2"><select id="order-status" class="field w-auto"><option value="all">All statuses</option>${["pending","dispatched","delivered"].map(x=>`<option ${state.orderStatus===x?"selected":""}>${x}</option>`).join("")}</select><input id="search" class="field w-48" placeholder="Search order / phone" value="${esc(state.search)}"><button id="apply-search" class="btn btn-primary">Search</button></div></div><section class="card">${state.busy?loadingLine():recentOrdersTable(state.orders)}</section>`}
      function productsView(){return `<div class="mb-5 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-xl font-black">Products & inventory</h2><p class="mt-1 text-sm text-slate-500">Maintain catalog and shared stock levels.</p></div><div class="flex gap-2"><input id="search" class="field w-56" placeholder="Search products" value="${esc(state.search)}"><button id="apply-search" class="btn btn-light">Search</button><button id="new-product" class="btn btn-primary">＋ Add product</button></div></div><section class="card">${state.busy?loadingLine():state.products.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Cost</th><th>Sale price</th><th>Available stock</th><th>Status</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><div class="flex items-center gap-3">${p.image_url?`<img src="${esc(p.image_url)}" alt="" class="h-10 w-10 rounded-lg object-cover" loading="lazy">`:`<div class="grid h-10 w-10 place-items-center rounded-lg bg-slate-100">▣</div>`}<div><div class="font-bold">${esc(p.name)}</div><div class="max-w-xs truncate text-xs text-slate-400">${esc(p.description||p.colors||"")}</div></div></div></td><td>${esc(p.sku||"—")}</td><td>${esc(money(p.cost_price))}</td><td class="font-bold">${esc(money(p.price))}</td><td><span class="font-bold ${Number(p.stock)<=Number(p.low_stock_threshold||0)?"text-rose-600":""}">${esc(p.stock??0)}</span></td><td><span class="badge ${p.is_active===false?"bg-slate-100 text-slate-500":"bg-emerald-50 text-emerald-700"}">${p.is_active===false?"inactive":"active"}</span></td><td><div class="flex gap-1"><button class="edit-product rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold hover:bg-slate-200" data-id="${esc(p.id)}">Edit</button><button class="adjust-stock rounded-lg bg-blue-50 px-3 py-1.5 text-xs font-bold text-blue-700 hover:bg-blue-100" data-id="${esc(p.id)}">Stock</button></div></td></tr>`).join("")}</tbody></table></div>`:emptyState("No products found","Add a product or adjust your search.")}</section>`}
      function posView(){const total=state.cart.reduce((s,x)=>s+x.price*x.quantity,0);return `<div class="mb-5"><h2 class="text-xl font-black">Shop POS</h2><p class="mt-1 text-sm text-slate-500">In-store sale. Prices and stock are verified again by the server.</p></div><div class="grid gap-5 xl:grid-cols-[1.4fr_.8fr]"><section class="card p-5"><div class="mb-4 flex gap-2"><input id="search" class="field" placeholder="Find product" value="${esc(state.search)}"><button id="apply-search" class="btn btn-light">Search</button></div><div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${state.products.filter(p=>p.is_active!==false&&Number(p.stock)>0).map(p=>`<button class="product-pick rounded-xl border border-slate-200 p-3 text-left hover:border-blue-400 hover:bg-blue-50" data-product="${esc(p.id)}"><div class="font-bold">${esc(p.name)}</div><div class="mt-1 text-sm text-slate-500">${esc(money(p.price))} · ${esc(p.stock)} in stock</div></button>`).join("")||`<div class="col-span-full">${emptyState("No available products","Active in-stock products will appear here.")}</div>`}</div></section><section class="card p-5"><div class="flex items-center justify-between"><h3 class="font-black">Current sale</h3><button id="clear-cart" class="text-xs font-bold text-rose-600">Clear</button></div><div class="mt-4 space-y-3">${state.cart.map((x,i)=>`<div class="flex items-center justify-between gap-3 border-b border-slate-100 pb-3"><div class="min-w-0"><div class="truncate text-sm font-bold">${esc(x.name)}</div><div class="text-xs text-slate-500">${esc(money(x.price))} × ${x.quantity}</div></div><div class="flex items-center gap-1"><button class="qty-btn rounded bg-slate-100 px-2 py-1" data-i="${i}" data-d="-1">−</button><button class="qty-btn rounded bg-slate-100 px-2 py-1" data-i="${i}" data-d="1">＋</button></div></div>`).join("")||`<p class="py-8 text-center text-sm text-slate-400">Add products to start a sale.</p>`}</div><div class="mt-5 border-t pt-4"><div class="flex justify-between text-lg font-black"><span>Total</span><span>${esc(money(total))}</span></div><label class="mt-4 block text-sm font-semibold">Payment method<select id="pos-method" class="field mt-2"><option value="cash">Cash</option><option value="card">Card terminal</option><option value="bank_transfer">Bank transfer</option><option value="other">Other</option></select></label><button id="complete-sale" class="btn btn-primary mt-4 w-full" ${state.cart.length?"":"disabled"}>Complete sale · ${esc(money(total))}</button><p class="mt-2 text-center text-[11px] text-slate-400">One-time request key prevents duplicate sale submissions.</p></div></section></div>`}
      function expensesView(){return `<div class="mb-5 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-xl font-black">Expenses</h2><p class="mt-1 text-sm text-slate-500">Record operating costs for accurate net profit.</p></div><div class="flex gap-2"><input id="date-from" type="date" class="field w-auto" value="${esc(state.dateFrom)}"><input id="date-to" type="date" class="field w-auto" value="${esc(state.dateTo)}"><button id="apply-dates" class="btn btn-light">Filter</button><button id="new-expense" class="btn btn-primary">＋ Add expense</button></div></div><section class="card">${state.busy?loadingLine():state.expenses.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Recorded by</th></tr></thead><tbody>${state.expenses.map(x=>`<tr><td>${esc(dateFmt(x.expense_date||x.created_at))}</td><td><span class="badge bg-slate-100 text-slate-600">${esc(x.category)}</span></td><td>${esc(x.note||x.description||"—")}</td><td class="font-bold text-rose-700">${esc(money(x.amount))}</td><td>${esc(x.created_by_name||"—")}</td></tr>`).join("")}</tbody></table></div>`:emptyState("No expenses in this period","Record an expense to include it in net profit.")}</section>`}
      function reportsView(){const r=state.report||{}; const k=r.metrics||r;return `<div class="mb-5 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-xl font-black">Sales & profit reports</h2><p class="mt-1 text-sm text-slate-500">Payments received, sales value and profit are shown separately.</p></div><div class="flex gap-2"><input id="date-from" type="date" class="field w-auto" value="${esc(state.dateFrom)}"><input id="date-to" type="date" class="field w-auto" value="${esc(state.dateTo)}"><button id="apply-dates" class="btn btn-primary">Apply range</button></div></div>${k.profit_data_complete===false?`<div class="mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">Profit is hidden because ${esc(k.orders_without_item_cost_snapshots)} older order(s) do not have item cost snapshots. Sales are still shown. Add item costs for those orders before relying on profit totals.</div>`:""}<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">${metric("Collected payments",money(k.collected_payments),"Successful payment records","₨","green")}${metric("Online order sales",money(k.online_sales),"Order value in selected range","▤","blue")}${metric("Physical shop sales",money(k.pos_sales),"POS sale value","▣","violet")}${metric("Cost of goods sold",money(k.cost_of_goods),"Based on saved item cost snapshots","↘","amber")}${metric("Expenses",money(k.expenses),"Recorded business expenses","−","amber")}${metric("Net profit",money(k.net_profit),"After product costs and expenses","↗","green")}</div><p class="mt-4 text-xs text-slate-400">Report values come from the secured API. Delivered order status alone is not treated as proof of payment.</p>`}
      function modal(title,body,onSubmit){const wrap=document.createElement("div");wrap.className="fixed inset-0 z-50 grid place-items-center bg-slate-950/50 p-4";wrap.innerHTML=`<div class="w-full max-w-xl rounded-2xl bg-white p-6 shadow-2xl"><div class="flex items-center justify-between"><h3 class="text-lg font-black">${esc(title)}</h3><button class="close-modal rounded-lg px-3 py-1 text-slate-500 hover:bg-slate-100">✕</button></div><form class="modal-form mt-5 space-y-4">${body}<div class="flex justify-end gap-2 pt-2"><button type="button" class="close-modal btn btn-light">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div><p class="modal-error text-sm text-rose-700"></p></form></div>`;document.body.appendChild(wrap);wrap.querySelectorAll(".close-modal").forEach(b=>b.onclick=()=>wrap.remove());wrap.addEventListener("click",e=>{if(e.target===wrap)wrap.remove()});wrap.querySelector("form").onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('[type="submit"]');button.disabled=true;try{await onSubmit(new FormData(e.currentTarget));wrap.remove()}catch(err){wrap.querySelector(".modal-error").textContent=err.message;button.disabled=false}}}
      function productModal(existing=null){const editing=!!existing;modal(editing?"Edit product":"Add product",`<label class="block text-sm font-semibold">Product name<input class="field mt-1" name="name" required maxlength="120" value="${esc(existing?.name||"")}"></label><div class="grid gap-3 sm:grid-cols-2"><label class="block text-sm font-semibold">SKU<input class="field mt-1" name="sku" maxlength="80" value="${esc(existing?.sku||"")}"></label><label class="block text-sm font-semibold">Category<input class="field mt-1" name="category" value="${esc(existing?.category||"")}"></label></div><label class="block text-sm font-semibold">Description / colors<textarea class="field mt-1" name="description" rows="2">${esc(existing?.description||existing?.colors||"")}</textarea></label><div class="grid gap-3 sm:grid-cols-2"><label class="block text-sm font-semibold">Cost (PKR)<input class="field mt-1" name="cost_price" type="number" min="0" step="0.01" required value="${esc(existing?.cost_price??"")}"></label><label class="block text-sm font-semibold">Sale price<input class="field mt-1" name="price" type="number" min="0.01" step="0.01" required value="${esc(existing?.price??"")}"></label>${editing?`<label class="block text-sm font-semibold">Product status<select class="field mt-1" name="is_active"><option value="true" ${existing.is_active===false?"":"selected"}>Active</option><option value="false" ${existing.is_active===false?"selected":""}>Inactive</option></select></label>`:`<label class="block text-sm font-semibold">Opening stock<input class="field mt-1" name="stock" type="number" min="0" step="1" required value="0"></label>`}</div>${editing?`<p class="text-xs text-slate-500">Stock changes are handled separately so each adjustment can be recorded.</p>`:""}<label class="block text-sm font-semibold">${editing?"Replace image (optional)":"Product image"}<input class="field mt-1" name="image" type="file" accept="image/png,image/jpeg,image/webp"></label>`,async form=>{const body=new FormData();["name","sku","category","description","cost_price","price","stock","is_active"].forEach(k=>{const value=form.get(k);if(value!==null)body.append(k,value)});if(form.get("image")?.size)body.append("image",form.get("image"));await api(editing?`/api/v1/admin/products/${encodeURIComponent(existing.id)}`:"/api/v1/admin/products",{method:editing?"PATCH":"POST",body});toast(editing?"Product updated":"Product saved");await loadPageData("products")})}
      function expenseModal(){modal("Record expense",`<div class="grid gap-3 sm:grid-cols-2"><label class="block text-sm font-semibold">Amount (PKR)<input class="field mt-1" name="amount" type="number" min="0.01" step="0.01" required></label><label class="block text-sm font-semibold">Date<input class="field mt-1" name="expense_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label></div><label class="block text-sm font-semibold">Category<select class="field mt-1" name="category" required><option>Rent</option><option>Utilities</option><option>Packaging</option><option>Marketing</option><option>Transport</option><option>Supplies</option><option>Other</option></select></label><label class="block text-sm font-semibold">Note<textarea class="field mt-1" name="note" rows="3" maxlength="500"></textarea></label>`,async form=>{await api("/api/v1/admin/expenses",{method:"POST",body:JSON.stringify(Object.fromEntries(form))});toast("Expense recorded");await loadPageData("expenses")})}
      async function updateOrder(id,status){try{await api(`/api/v1/admin/orders/${encodeURIComponent(id)}/status`,{method:"PATCH",body:JSON.stringify({status})});toast("Order status updated");await loadPageData("orders")}catch(e){toast(e.message,"error")}}
      async function adjustStock(product){const deltaText=prompt(`Stock change for ${product.name}: enter +quantity to add or -quantity to remove.`);if(deltaText===null)return;const delta=Number(deltaText);if(!Number.isInteger(delta)||delta===0){toast("Enter a non-zero whole number.","error");return}const reason=prompt("Reason (for example: new stock received, damaged, correction):");if(!reason?.trim())return;try{await api(`/api/v1/admin/products/${encodeURIComponent(product.id)}/stock`,{method:"PATCH",body:JSON.stringify({quantity_delta:delta,reason:reason.trim()})});toast("Stock updated and recorded");await loadPageData("products")}catch(e){toast(e.message,"error")}}
      function bindPageActions(){
        app.querySelectorAll("[data-page]").forEach(b=>{if(!b.closest("nav"))b.onclick=()=>go(b.dataset.page)});
        const apply=document.getElementById("apply-search");if(apply)apply.onclick=()=>{state.search=document.getElementById("search").value.trim();loadPageData()};
        const sel=document.getElementById("order-status");if(sel)sel.onchange=()=>{state.orderStatus=sel.value;loadPageData("orders")};
        const dates=document.getElementById("apply-dates");if(dates)dates.onclick=()=>{state.dateFrom=document.getElementById("date-from").value;state.dateTo=document.getElementById("date-to").value;loadPageData()};
        const np=document.getElementById("new-product");if(np)np.onclick=()=>productModal();const ne=document.getElementById("new-expense");if(ne)ne.onclick=expenseModal;
        app.querySelectorAll(".edit-product").forEach(b=>b.onclick=()=>{const p=state.products.find(x=>String(x.id)===b.dataset.id);if(p)productModal(p)});
        app.querySelectorAll(".adjust-stock").forEach(b=>b.onclick=()=>{const p=state.products.find(x=>String(x.id)===b.dataset.id);if(p)adjustStock(p)});
        app.querySelectorAll(".product-pick").forEach(b=>b.onclick=()=>{const p=state.products.find(x=>String(x.id)===b.dataset.product);if(!p)return;const item=state.cart.find(x=>x.id===p.id);if(item)item.quantity++;else state.cart.push({id:p.id,name:p.name,price:Number(p.price),quantity:1});render()});
        app.querySelectorAll(".qty-btn").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);state.cart[i].quantity+=Number(b.dataset.d);if(state.cart[i].quantity<1)state.cart.splice(i,1);render()});
        const clear=document.getElementById("clear-cart");if(clear)clear.onclick=()=>{state.cart=[];render()};
        const sale=document.getElementById("complete-sale");if(sale)sale.onclick=async()=>{if(!state.cart.length)return;sale.disabled=true;try{const key=crypto.randomUUID();await api("/api/v1/pos/sales",{method:"POST",headers:{"Idempotency-Key":key},body:JSON.stringify({items:state.cart.map(x=>({product_id:String(x.id),quantity:x.quantity})),payment_method:document.getElementById("pos-method").value})});state.cart=[];toast("Sale completed");await loadPageData("pos")}catch(e){toast(e.message,"error");sale.disabled=false}};
        app.querySelectorAll("[data-order-status]").forEach(b=>b.onclick=()=>updateOrder(b.dataset.id,b.dataset.orderStatus));
      }
      function render(){if(!state.session){loginView();return}let content="";switch(state.page){case"overview":content=overviewView();break;case"orders":content=ordersView();break;case"products":content=productsView();break;case"pos":content=posView();break;case"expenses":content=expensesView();break;case"reports":content=reportsView();break;default:content=overviewView()}shell(content);bindPageActions();}
      async function go(page){state.page=page;state.search="";state.busy=true;render();await loadPageData(page)}
      async function logout(){try{if(supabase)await supabase.auth.signOut()}finally{state.session=null;state.user=null;state.products=[];state.orders=[];state.cart=[];render()}}
      function decorateOrders(){app.querySelectorAll("tbody tr").forEach((row,i)=>{if(state.page!=="orders")return;const order=state.orders[i];if(!order)return;const cell=row.lastElementChild;if(!cell)return;let actions="";if(order.status==="pending")actions=`<button class="rounded-lg bg-blue-50 px-2 py-1 text-xs font-bold text-blue-700" data-order-status="dispatched" data-id="${esc(order.id)}">Dispatch</button>`;else if(order.status==="dispatched")actions=`<button class="rounded-lg bg-emerald-50 px-2 py-1 text-xs font-bold text-emerald-700" data-order-status="delivered" data-id="${esc(order.id)}">Mark delivered</button>`;if(actions)cell.insertAdjacentHTML("beforeend",` <span class="ml-2">${actions}</span>`)});app.querySelectorAll("[data-order-status]").forEach(b=>b.onclick=()=>updateOrder(b.dataset.id,b.dataset.orderStatus))}
      // Add fulfilment actions to the orders list after rendering its rows.
      const originalRender=render;
      render=function(){originalRender();if(state.session&&state.page==="orders")decorateOrders()};
      async function boot(){if(!supabase){loginView();return}try{const {data}=await supabase.auth.getSession();if(data.session){state.session=data.session;state.user=data.session.user;await loadPageData("overview")}else render();supabase.auth.onAuthStateChange((_event,session)=>{state.session=session;state.user=session?.user||null;if(!session)render()})}catch{render()}}
      boot();
    })();
  </script>
</body>
</html>
